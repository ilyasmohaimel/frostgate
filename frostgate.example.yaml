# frostgate example config
#
# Copy to one of (first existing wins):
#   $XDG_CONFIG_HOME/frostgate/config.yaml
#   ~/.config/frostgate/config.yaml
#   ./frostgate.yaml
# and edit with your real endpoints. Private configs are gitignored.
#
# Probe types:
#   tcp     - raw TCP connect time
#   tls     - TCP + TLS handshake (use sni)
#   http    - HTTPS GET; use `url:` or host/port/path
#   singbox - end-to-end via local sing-box outbound (recommended for proxy routes)

defaults:
  timeout: 5s
  samples: 4
  sample_interval: 150ms
  healthy_latency: 800ms
  max_jitter: 80ms

singbox:
  controller: http://127.0.0.1:9090
  # secret: ""                  # or set FROSTGATE_SINGBOX_SECRET env
  # secret_file: ~/.config/frostgate/controller-secret
  test_url: https://www.gstatic.com/generate_204

endpoints:
  - name: direct-baseline
    type: http
    url: https://www.gstatic.com/generate_204
    priority: 100

  - name: primary-reality
    type: singbox
    outbound: primary-reality
    priority: 10

  - name: backup-hysteria2
    type: singbox
    outbound: backup-hysteria2
    priority: 20

  - name: xhttp-fallback
    type: singbox
    outbound: xhttp-fallback
    priority: 30

  # Optional basic reachability diagnostics (layer 1):
  # - name: server-tcp
  #   type: tcp
  #   host: example.com
  #   port: 443

  # - name: server-tls
  #   type: tls
  #   host: example.com
  #   port: 443
  #   sni: example.com
