# frostgate example config
#
# Copy to one of (first existing wins):
#   $XDG_CONFIG_HOME/frostgate/config.yaml
#   ~/.config/frostgate/config.yaml
#   ./frostgate.yaml
# and edit with your real endpoints. Private configs are gitignored.
#
# Most users should run `frostgate setup` / `frostgate add` / `frostgate import`
# instead of editing this manually. This file is the advanced path.
#
# Probe types:
#   tcp     - raw TCP connect time
#   tls     - TCP + TLS handshake (use sni)
#   http    - HTTPS GET; use `url:` or host/port/path
#   singbox - end-to-end via local sing-box outbound (recommended for proxy routes)

defaults:
  timeout: 5s
  samples: 4
  sample_interval: 150ms
  healthy_latency: 800ms
  max_jitter: 80ms

singbox:
  controller: http://127.0.0.1:9090
  # secret: ""                  # or set FROSTGATE_SINGBOX_SECRET env
  # secret_file: ~/.config/frostgate/controller-secret
  test_url: https://www.gstatic.com/generate_204
  benchmark_proxy: 127.0.0.1:2080

benchmark:
  download_bytes: 8388608       # ~8 MiB per route
  download_url: https://speed.cloudflare.com/__down

history:
  enabled: true
  retention: 90d                # auto-prune after 90 days
  watch_interval: 5m            # one persisted snapshot per 5m in --watch

network_check:
  destinations:
    - name: github
      url: https://github.com/
    - name: wikipedia
      url: https://www.wikipedia.org/
    - name: google
      url: https://www.google.com/generate_204

endpoints:
  - name: direct-baseline
    type: http
    url: https://www.gstatic.com/generate_204
    expected_status: 204
    priority: 100

  - name: primary-reality
    type: singbox
    outbound: primary-reality
    priority: 10

  - name: backup-hysteria2
    type: singbox
    outbound: backup-hysteria2
    priority: 20

  # Optional basic reachability diagnostics (layer 1):
  # - name: server-tcp
  #   type: tcp
  #   host: example.com
  #   port: 443

  # - name: server-tls
  #   type: tls
  #   host: example.com
  #   port: 443
  #   sni: example.com
