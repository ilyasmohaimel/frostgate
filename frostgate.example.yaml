# frostgate example config
#
# Copy this to `frostgate.yaml` and edit with your real endpoints.
# `frostgate.yaml` is gitignored so your real hostnames never get committed.
#
# Each endpoint describes one route to probe. `type` decides how it's tested:
#   tcp   - measure time to open a raw TCP connection
#   tls   - open TCP + complete a TLS handshake (use `sni` to set the server name)
#   http  - issue an HTTP(S) GET and measure time to first response
#
# In China these would point at your Tokyo VM's exposed ports.

defaults:
  timeout: 5s        # per-probe deadline; a route slower than this is "down"

endpoints:
  - name: tokyo-reality      # VLESS + XTLS-Reality (primary)
    host: example.com        # the SNI/host sing-box fronts as
    port: 443
    type: tls
    sni: example.com

  - name: tokyo-hysteria     # Hysteria 2 (backup, QUIC/UDP)
    host: 203.0.113.10       # raw IP of the Oracle Tokyo VM
    port: 8443
    type: tcp                # v0 reachability check; real H2 probe is on the roadmap

  - name: cloudflare-204     # neutral baseline to sanity-check your own link
    host: www.gstatic.com
    port: 443
    type: http
    path: /generate_204
